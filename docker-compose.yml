services:
  ccdi-api:
    build: .
    expose:
      - "8000"  # Internal port only, not exposed to host
    environment:
      - PYTHONPATH=/app
    volumes:
      # Mount data directory for development (optional)
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ccdi-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ccdi-api
    restart: unless-stopped
    networks:
      - ccdi-network

networks:
  ccdi-network:
    driver: bridge
